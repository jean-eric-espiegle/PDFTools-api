# Generated for the PDF Toolkit API MVP. Adjust `app` if the name is taken
# (fly launch will prompt you) and `primary_region` to whatever's closest to
# your users: https://fly.io/docs/reference/regions/
app = "pdf-toolkit-api"
primary_region = "iad"

[build]

[env]
  PORT = "8787"
  FREE_TIER_MONTHLY_LIMIT = "100"

# SQLite (API keys + usage log) needs a single writer, so this stays pinned
# to exactly one machine. Scale up only after moving to Postgres.
[[mounts]]
  source = "pdf_toolkit_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Always-on: avoids cold-start latency and keeps a stable attachment to
  # the single SQLite-backed volume. Revisit once there's real traffic.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
