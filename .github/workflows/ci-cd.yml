name: CI/CD

# Runs on every PR targeting main (test + smoke test only, no deploy — a PR
# should never be able to touch production) and on every push to main,
# which in practice means "a PR just got merged" since direct pushes to
# main are blocked by branch protection. Deploy only fires on that second
# case, and only after the exact same checks pass again post-merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test, build, and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t pdf-toolkit-api:ci .

      - name: Start container
        run: |
          mkdir -p ci-data
          docker run -d --name smoke-test-app \
            -p 8787:8787 \
            -e DATA_DIR=/data \
            -e FREE_TIER_MONTHLY_LIMIT=100 \
            -v ${{ github.workspace }}/ci-data:/data \
            pdf-toolkit-api:ci
          # No STRIPE_SECRET_KEY / RESEND_API_KEY / ADMIN_API_KEY set —
          # those features no-op safely when unset (see src/lib/stripe.ts,
          # src/lib/email.ts, src/middleware/requireAdmin.ts), so this
          # never touches real Stripe objects or sends real email.

      # Runs on the runner itself (not inside the container), talking to
      # the published port — same script and same DB-reading approach
      # (better-sqlite3 in readonly mode against the bind-mounted volume)
      # already verified working locally against the dev server.
      - name: Run smoke test against the built image
        run: npx tsx scripts/smoke-test.ts
        env:
          BASE_URL: http://localhost:8787
          DATA_DIR: ./ci-data

      - name: Container logs
        if: always()
        run: docker logs smoke-test-app

      - name: Stop container
        if: always()
        run: docker rm -f smoke-test-app

  deploy:
    name: Deploy to Fly.io
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
