<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm Email: PDF Toolkit API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="wordmark"><span class="mark">P</span>PDF Toolkit API</a>
  <nav class="topbar-links">
    <a href="/docs">Docs</a>
  </nav>
</header>

<div class="center-page">
  <div class="wrap">
    <div class="card auth-card" style="text-align:center;">
      <div id="state-loading">
        <h1>Confirming your email...</h1>
      </div>
      <div id="state-success" style="display:none;">
        <h1>Email confirmed</h1>
        <p class="auth-note">You can now create API keys and subscribe to a paid plan.</p>
        <a class="btn-primary" href="/dashboard">Go to dashboard</a>
      </div>
      <div id="state-error" style="display:none;">
        <h1>Link invalid or expired</h1>
        <p class="auth-note">Confirmation links expire after 24 hours. Sign in and request a new one if needed.</p>
        <a class="btn-primary" href="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script>
  var token = new URLSearchParams(location.search).get("token");
  var loading = document.getElementById("state-loading");
  var success = document.getElementById("state-success");
  var error = document.getElementById("state-error");

  if (!token) {
    loading.style.display = "none";
    error.style.display = "block";
  } else {
    fetch("/auth/confirm?token=" + encodeURIComponent(token))
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (res) {
        loading.style.display = "none";
        if (res.ok) {
          success.style.display = "block";
        } else {
          error.style.display = "block";
        }
        // Don't leave the confirmation token sitting in the visible URL
        // longer than needed.
        history.replaceState(null, "", "/confirm");
      })
      .catch(function () {
        loading.style.display = "none";
        error.style.display = "block";
      });
  }
</script>
</body>
</html>
