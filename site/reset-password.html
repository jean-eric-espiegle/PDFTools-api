<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set New Password: PDF Toolkit API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="wordmark"><span class="mark">P</span>PDF Toolkit API</a>
  <nav class="topbar-links">
    <a href="/login">Sign in</a>
  </nav>
</header>

<div class="center-page">
  <div class="wrap">
    <div class="card auth-card">
      <div id="state-form">
        <h1>Set a new password</h1>
        <p class="auth-note">This signs you out everywhere else, on every device.</p>

        <div class="alert" id="alert"></div>

        <form id="reset-form" novalidate>
          <div class="field" id="field-password">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
            <div class="field-hint">At least 8 characters.</div>
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn-primary" id="submit-btn">Set new password</button>
        </form>
      </div>

      <div id="state-no-token" style="display:none; text-align:center;">
        <h1>Link missing its token</h1>
        <p class="auth-note">Use the link from your password reset email, or request a new one.</p>
        <a class="btn-primary" href="/forgot-password">Request a reset link</a>
      </div>

      <div id="state-done" style="display:none; text-align:center;">
        <h1>Password updated</h1>
        <p class="auth-note">Sign in with your new password.</p>
        <a class="btn-primary" href="/login">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
  var Auth = window.PdfToolkitAuth;
  var token = new URLSearchParams(location.search).get("token");

  if (!token) {
    document.getElementById("state-form").style.display = "none";
    document.getElementById("state-no-token").style.display = "block";
  } else {
    // Don't leave the reset token sitting in the visible URL longer than needed.
    history.replaceState(null, "", "/reset-password");

    var form = document.getElementById("reset-form");
    var alertEl = document.getElementById("alert");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      Auth.hideAlert(alertEl);

      var password = document.getElementById("password").value;
      var btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Updating...";

      Auth.apiFetch("/auth/reset-password", {
        method: "POST",
        body: JSON.stringify({ token: token, newPassword: password }),
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = "Set new password";

        if (!res.ok) {
          Auth.showAlert(alertEl, res.body.data.error || "That link may have expired.");
          return;
        }

        document.getElementById("state-form").style.display = "none";
        document.getElementById("state-done").style.display = "block";
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "Set new password";
        Auth.showAlert(alertEl, "Network error. Try again.");
      });
    });
  }
</script>
</body>
</html>
