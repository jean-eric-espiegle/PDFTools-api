<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Complete your profile: PDF Toolkit API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
  @media (max-width: 640px) { .field-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="wordmark"><svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 3 L16 29 M16 3 L24 11 M16 15 L23 21 M16 3 L8 11 M16 15 L9 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>PDF Toolkit API</a>
</header>

<div class="center-page">
  <div class="wrap">
    <div class="card auth-card">
      <h1>Complete your profile</h1>
      <p class="auth-note">A few details we need before you can create API keys or subscribe to a plan. This only takes a minute.</p>

      <div class="alert" id="alert"></div>

      <form id="profile-form" novalidate>
        <div class="field-grid">
          <div class="field" id="field-firstName">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>
            <div class="field-error"></div>
          </div>
          <div class="field" id="field-lastName">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>
            <div class="field-error"></div>
          </div>
        </div>
        <div class="field" id="field-dateOfBirth">
          <label for="dateOfBirth">Date of birth</label>
          <input type="date" id="dateOfBirth" name="dateOfBirth" autocomplete="bday" required>
          <div class="field-error"></div>
        </div>
        <div class="field-grid">
          <div class="field" id="field-city">
            <label for="city">City</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" required>
            <div class="field-error"></div>
          </div>
          <div class="field" id="field-country">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" autocomplete="country-name" required>
            <div class="field-error"></div>
          </div>
        </div>
        <div class="field" id="field-address">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" autocomplete="street-address" required>
          <div class="field-error"></div>
        </div>
        <div class="field" id="field-billingAddress">
          <label for="billingAddress">Billing address</label>
          <input type="text" id="billingAddress" name="billingAddress" autocomplete="off" required>
          <div class="field-hint">Same as your address above if you don't bill separately.</div>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Continue</button>
      </form>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
  var Auth = window.PdfToolkitAuth;
  if (!Auth.requireAuthOrRedirect()) {
    // requireAuthOrRedirect already navigated away.
  } else {
    // Already completed (e.g. back button after submitting) — nothing to
    // do here, send them on to the dashboard.
    Auth.apiFetch("/auth/me").then(function (res) {
      if (res.ok && res.body.data.user.profileCompleted) location.href = "/dashboard";
    });
  }

  var FIELDS = ["firstName", "lastName", "dateOfBirth", "city", "country", "address", "billingAddress"];
  var form = document.getElementById("profile-form");
  var alertEl = document.getElementById("alert");
  var submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    Auth.hideAlert(alertEl);

    var values = {};
    var missing = false;
    FIELDS.forEach(function (field) {
      var fieldEl = document.getElementById("field-" + field);
      Auth.clearFieldError(fieldEl);
      var value = document.getElementById(field).value.trim();
      values[field] = value;
      if (!value) {
        Auth.setFieldError(fieldEl, "Required.");
        missing = true;
      }
    });
    if (missing) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";

    Auth.apiFetch("/auth/complete-profile", {
      method: "POST",
      body: JSON.stringify(values),
    }).then(function (res) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue";

      if (!res.ok) {
        Auth.showAlert(alertEl, res.body.data.error || "Something went wrong.");
        return;
      }

      location.href = "/dashboard";
    }).catch(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue";
      Auth.showAlert(alertEl, "Network error. Try again.");
    });
  });
</script>
</body>
</html>
