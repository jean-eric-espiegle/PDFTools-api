<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset Password: PDF Toolkit API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
</head>
<body>

<header class="topbar">
  <a href="/" class="wordmark"><span class="mark">P</span>PDF Toolkit API</a>
  <nav class="topbar-links">
    <a href="/login">Sign in</a>
  </nav>
</header>

<div class="center-page">
  <div class="wrap">
    <div class="card auth-card">
      <div id="state-form">
        <h1>Reset your password</h1>
        <p class="auth-note">We'll email you a link if the address is registered.</p>

        <div class="alert" id="alert"></div>

        <form id="forgot-form" novalidate>
          <div class="field" id="field-email">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn-primary" id="submit-btn">Send reset link</button>
        </form>
      </div>

      <div id="state-sent" style="display:none; text-align:center;">
        <h1>Check your email</h1>
        <p class="auth-note">If that address is registered, a reset link is on its way. It expires in 1 hour.</p>
        <a class="btn-primary" href="/login">Back to sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
  var Auth = window.PdfToolkitAuth;
  var form = document.getElementById("forgot-form");
  var alertEl = document.getElementById("alert");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    Auth.hideAlert(alertEl);

    var email = document.getElementById("email").value.trim();
    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Sending...";

    Auth.apiFetch("/auth/forgot-password", {
      method: "POST",
      body: JSON.stringify({ email: email }),
    }).then(function (res) {
      btn.disabled = false;
      btn.textContent = "Send reset link";

      if (!res.ok) {
        Auth.showAlert(alertEl, res.body.data.error || "Something went wrong.");
        return;
      }

      document.getElementById("state-form").style.display = "none";
      document.getElementById("state-sent").style.display = "block";
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "Send reset link";
      Auth.showAlert(alertEl, "Network error. Try again.");
    });
  });
</script>
</body>
</html>
